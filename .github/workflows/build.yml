name: Build apps

# Two jobs:
#   shell    - fast check: both apps compile against the mock core (every push and PR).
#   release  - builds the EKA2L1 core for iOS and macOS, links the real apps, packages
#              Halcyon.ipa and Halcyon.dmg, and (on main) publishes them as the
#              release named in VERSION. Raise VERSION for a new release; otherwise the
#              current release's files are replaced.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "core/**"
      - "external/**"
      - ".gitmodules"
      - "VERSION"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (mock core)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        working-directory: apple
        run: xcodegen generate

      - name: Build iPhone app (mock core)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Halcyon.xcodeproj -target HalcyonIOS -configuration Debug -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios.log \
            || { grep -E "error:" ios.log | sort -u | head -40 | sed 's/^/::error::iOS /'; exit 1; }

      - name: Build Mac app (mock core)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Halcyon.xcodeproj -target HalcyonMac -configuration Debug \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac.log \
            || { grep -E "error:" mac.log | sort -u | head -40 | sed 's/^/::error::Mac /'; exit 1; }

      # Full error lists go to the ci-logs branch (annotations stop at 10 per step).
      - name: Publish error log
        if: failure()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs" && cd "$RUNNER_TEMP/ci-logs"
          for f in "$GITHUB_WORKSPACE"/core-*.log "$GITHUB_WORKSPACE"/apple/*.log; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .log)"
            grep -hE "error:|Error |Undefined symbol|undefined reference|CMake Error|ld: " "$f" | sort -u | head -400 > "$name-errors.txt" || true
            tail -300 "$f" > "$name-tail.txt"
          done
          echo "run ${GITHUB_RUN_ID} job ${GITHUB_JOB} commit ${GITHUB_SHA}" > README.txt
          git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Logs for run ${GITHUB_RUN_ID} (${GITHUB_JOB})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-logs:ci-logs-${GITHUB_JOB}"

  core:
    name: Emulator core
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache key
        id: key
        # Only the files that change what the core build produces.
        run: echo "key=core-$(git rev-parse HEAD:external/eka2l1)-${{ hashFiles('core/embed/**', 'core/scripts/build-core.sh', 'core/scripts/build-ffmpeg.sh', 'core/scripts/patch-core.py') }}" >> "$GITHUB_OUTPUT"

      # Built once per core change and cached on its own, so app-only changes
      # never wait for the core.
      - name: Restore emulator core
        id: cache
        uses: actions/cache@v4
        with:
          path: core/out
          key: ${{ steps.key.outputs.key }}

      - name: Select newest Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja

      - name: Build emulator core (iOS)
        if: steps.cache.outputs.cache-hit != 'true'
        run: core/scripts/build-core.sh ios 2>&1 | tee core-ios.log; exit ${PIPESTATUS[0]}

      # Runs even when the iOS core failed, so one run reports both platforms' errors.
      - name: Build emulator core (macOS)
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        run: core/scripts/build-core.sh macos 2>&1 | tee core-macos.log; exit ${PIPESTATUS[0]}

      - name: Report core build errors
        if: failure()
        run: |
          grep -hE "error:|Error |undefined reference|Undefined symbol|CMake Error" core-*.log 2>/dev/null \
            | sort -u | head -120 | sed 's/^/::error::core /' || true

      # Full error lists go to the ci-logs branch (annotations stop at 10 per step).
      - name: Publish error log
        if: failure()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs" && cd "$RUNNER_TEMP/ci-logs"
          for f in "$GITHUB_WORKSPACE"/core-*.log "$GITHUB_WORKSPACE"/apple/*.log; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .log)"
            grep -hE "error:|Error |Undefined symbol|undefined reference|CMake Error|ld: " "$f" | sort -u | head -400 > "$name-errors.txt" || true
            tail -300 "$f" > "$name-tail.txt"
          done
          echo "run ${GITHUB_RUN_ID} job ${GITHUB_JOB} commit ${GITHUB_SHA}" > README.txt
          git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Logs for run ${GITHUB_RUN_ID} (${GITHUB_JOB})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-logs:ci-logs-${GITHUB_JOB}"

  release:
    name: Apps with emulator core
    needs: core
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Restore emulator core
        uses: actions/cache/restore@v4
        with:
          path: core/out
          key: ${{ needs.core.outputs.key }}
          fail-on-cache-miss: true

      - name: Link the real core
        run: |
          core/scripts/write-xcconfig.sh ios
          core/scripts/write-xcconfig.sh macos

      - name: Generate project
        working-directory: apple
        run: xcodegen generate

      - name: Build iPhone app
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Halcyon.xcodeproj -target HalcyonIOS -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ios.log \
            || { grep -E "error:|Undefined symbol" ios.log | sort -u | head -60 | sed 's/^/::error::iOS /'; exit 1; }
          scripts/package-ipa.sh "$PWD/build/Release-iphoneos" "$GITHUB_WORKSPACE/Halcyon.ipa"

      - name: Build Mac app
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -project Halcyon.xcodeproj -target HalcyonMac -configuration Release \
            SYMROOT="$PWD/build" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac.log \
            || { grep -E "error:|Undefined symbol" mac.log | sort -u | head -60 | sed 's/^/::error::Mac /'; exit 1; }

      # Full error lists go to the ci-logs branch (annotations stop at 10 per step).
      - name: Publish error log
        if: failure()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs" && cd "$RUNNER_TEMP/ci-logs"
          for f in "$GITHUB_WORKSPACE"/core-*.log "$GITHUB_WORKSPACE"/apple/*.log; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .log)"
            grep -hE "error:|Error |Undefined symbol|undefined reference|CMake Error|ld: " "$f" | sort -u | head -400 > "$name-errors.txt" || true
            tail -300 "$f" > "$name-tail.txt"
          done
          echo "run ${GITHUB_RUN_ID} job ${GITHUB_JOB} commit ${GITHUB_SHA}" > README.txt
          git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Logs for run ${GITHUB_RUN_ID} (${GITHUB_JOB})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-logs:ci-logs-${GITHUB_JOB}"

      # Optional: Developer ID signing + notarization when these secrets exist.
      - name: Import signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Package Mac app (.dmg)
        working-directory: apple
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/package-mac.sh "$PWD/build/Release/Halcyon.app" "$GITHUB_WORKSPACE/Halcyon.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Halcyon-${{ env.VERSION }}
          path: |
            Halcyon.ipa
            Halcyon.dmg

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Halcyon ${{ env.VERSION }}
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            **iPhone and iPad:** install `Halcyon.ipa` with SideStore, AltStore or Sideloadly, or add the source from the website. For JIT, launch it from StikDebug.
            **Mac (Apple silicon):** open `Halcyon.dmg` and drag Halcyon to Applications.

            You need firmware dumped from your own Symbian phone. See the guide on the website.
          files: |
            Halcyon.ipa
            Halcyon.dmg
