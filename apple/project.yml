# XcodeGen spec. From apple/: `xcodegen generate` creates Halcyon.xcodeproj.
# The emulator core is linked when core/scripts/build-core.sh has run; otherwise
# the apps build against a mock core (see Config/Base.xcconfig).
name: Halcyon
options:
  bundleIdPrefix: io.github.harkhowalia1
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

# Keys every app target puts in Info.plist (values come from Config/Base.xcconfig).
targetTemplates:
  HalcyonInfo:
    info:
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HalcyonAppGroup: $(APP_GROUP)
        HalcyonURLScheme: $(URL_SCHEME)
        HalcyonAppBundleID: $(PRODUCT_BUNDLE_IDENTIFIER)
        HalcyonRepositoryURL: $(REPOSITORY_URL)
        HalcyonWebsiteURL: $(WEBSITE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(URL_SCHEME)]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.halcyon.sis-package
            UTTypeDescription: Symbian installation package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sis, SIS]
          - UTTypeIdentifier: io.github.halcyon.sisx-package
            UTTypeDescription: Symbian installation package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sisx, SISX]
          - UTTypeIdentifier: io.github.halcyon.symbian-rom
            UTTypeDescription: Symbian phone ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rom, ROM]
          - UTTypeIdentifier: io.github.halcyon.rpkg
            UTTypeDescription: "Symbian Z: drive package"
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rpkg, RPKG]
          - UTTypeIdentifier: io.github.halcyon.vpl
            UTTypeDescription: Symbian firmware manifest
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vpl, VPL]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Symbian installation package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.halcyon.sis-package, io.github.halcyon.sisx-package]
          - CFBundleTypeName: Symbian phone firmware
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.halcyon.symbian-rom, io.github.halcyon.rpkg, io.github.halcyon.vpl]
          # Lets "Open in Halcyon" accept a .zip holding the ROM and RPKG.
          - CFBundleTypeName: Zip archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge/Halcyon-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: $(APP_NAME)
    postCompileScripts:
      - name: Copy emulator core assets
        basedOnDependencyAnalysis: false
        script: |
          # Shaders, MIDI banks, compat data and Symbian patch DLLs from core/out/<platform>/assets.
          if [ -n "${HALCYON_CORE_ASSETS}" ] && [ -d "${HALCYON_CORE_ASSETS}" ]; then
            mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/assets"
            rsync -a --delete "${HALCYON_CORE_ASSETS}/" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/assets/"
          fi

targets:
  # ---------------------------------------------------------------- iPhone & iPad
  HalcyonIOS:
    type: application
    platform: iOS
    templates: [HalcyonInfo]
    sources:
      - path: iOS
      - path: Shared
      - path: Resources/iOS.xcassets
    dependencies:
      - target: HalcyonWidgetsIOS
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes: [stikjit, stikdebug, shortcuts]
        NSMotionUsageDescription: Symbian games that use the tilt sensor read your device's motion.
        NSLocalNetworkUsageDescription: Adding an app to your Home Screen briefly serves a profile to Safari from this device.
    entitlements:
      path: iOS/Halcyon.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        # Lets StikDebug attach a debugger, which is how iOS grants JIT to sideloaded apps.
        get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  HalcyonWidgetsIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Model/AppConfig.swift
      - path: Shared/Model/SymbianApp.swift
      - path: Shared/Model/DeepLink.swift
      - path: Shared/Model/SharedStore.swift
      - path: Shared/Model/HomeLayout.swift
      - path: Shared/Intents/SymbianAppEntity.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME) Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HalcyonAppGroup: $(APP_GROUP)
        HalcyonURLScheme: $(URL_SCHEME)
        HalcyonAppBundleID: $(BUNDLE_ID_PREFIX)
        HalcyonRepositoryURL: $(REPOSITORY_URL)
        HalcyonWebsiteURL: $(WEBSITE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HalcyonWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        PRODUCT_NAME: HalcyonWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        # The widgets never touch the emulator core.
        HALCYON_CORE_LDFLAGS: ""
        HALCYON_CORE_HEADERS: ""
        HALCYON_CORE_DEFINES: ""

  # ---------------------------------------------------------------- Mac
  HalcyonMac:
    type: application
    platform: macOS
    templates: [HalcyonInfo]
    sources:
      - path: macOS
      - path: Shared
      - path: Resources/macOS.xcassets
    info:
      path: macOS/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Free software under the GNU GPL v3.
    entitlements:
      path: macOS/Halcyon.entitlements
      properties:
        # Dynarmic JIT under the Hardened Runtime.
        com.apple.security.cs.allow-jit: true
        # SDL2.framework is signed ad hoc alongside the app.
        com.apple.security.cs.disable-library-validation: true
    postBuildScripts:
      - name: Embed SDL2.framework
        basedOnDependencyAnalysis: false
        script: |
          # The desktop drivers link SDL2 (input and haptics plumbing) when the real core is used.
          SDL="${SRCROOT}/../core/out/macos/SDL2.framework"
          if [ -d "${SDL}" ]; then
            mkdir -p "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
            rsync -a --delete "${SDL}" "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        COMBINE_HIDPI_IMAGES: YES
